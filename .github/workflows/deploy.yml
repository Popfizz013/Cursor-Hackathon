name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and drop superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Actions sets CI=true, and react-scripts treats every warning as a
          # fatal error when it is. This project builds with warnings (an
          # unused-console rule plus a missing source map inside a
          # node_modules dependency), so leaving this unset fails the build.
          CI: false
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

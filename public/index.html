<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme color with feature detection -->
    <script>
      // Only add theme-color meta tag for browsers that support it
      if (window.CSS && CSS.supports && CSS.supports('color', '#000000')) {
        const themeColorMeta = document.createElement('meta');
        themeColorMeta.name = 'theme-color';
        themeColorMeta.content = '#020610';
        document.head.appendChild(themeColorMeta);
      }
    </script>
    <!-- Fallback for older browsers -->
    <meta name="msapplication-navbutton-color" content="#020610" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Liam Degand — Computer Science student at the University of Victoria, working in robotics security, full-stack development and satellite communications."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Liam Degand — Computer Science Student</title>

    <!-- Responsive meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    
    <!-- Loading styles -->
    <link rel="stylesheet" href="%PUBLIC_URL%/loading.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Loading indicator -->
    <div id="loading">
      <div class="loading-content">
        <div class="spinner"></div>
        <p>Loading 3D Globe...</p>
      </div>
    </div>
  </body>
</html>
